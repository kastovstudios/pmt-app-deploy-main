<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="interface.css">
<script src="interface.js" defer></script>
<title>Criar conta</title>
</head>

<script>

async function verificarLogado(){

    const token =
        localStorage.getItem("token");

    if(!token){
        return;
    }

    try{

        const res = await fetch("/me",{
            headers:{
                Authorization: token
            }
        });

        // TOKEN INVÁLIDO
        if(!res.ok){

            localStorage.removeItem("token");

            return;
        }

        // TOKEN VÁLIDO
        window.location.href = "home.html";

    }
    catch{

        localStorage.removeItem("token");
    }
}

verificarLogado();

</script>

<body class="ui-page ui-auth" data-page="register">

<form class="container" data-action="registrar">

    <p class="ui-eyebrow">Sua conta</p>
<h2>Cadastro</h2>
<p class="ui-description">Preencha seus dados para começar.</p>

    <select id="posto">
        <option value="Sd Ev">Sd Ev</option>
        <option value="Sd">Sd</option>
        <option value="Cb">Cb</option>
        <option value="Al CFST">Al CFST</option>
        <option value="3º Sgt">3º Sgt</option>
        <option value="2º Sgt">2º Sgt</option>
        <option value="1º Sgt">1º Sgt</option>
        <option value="Sub Ten">Sub Ten</option>
        <option value="Asp">Asp</option>
        <option value="2º Ten">2º Ten</option>
        <option value="1º Ten">1º Ten</option>
        <option value="Cap">Cap</option>
        <option value="Maj">Maj</option>
        <option value="TC">TC</option>
        <option value="Cel">Cel</option>
    </select>

    <input id="nome" placeholder="Nome de guerra" required autocomplete="nickname">

    <input
        id="telefone"
        placeholder="Telefone (Whatsapp)"
     required type="tel" inputmode="tel" autocomplete="username">

    <input
        id="senha"
        type="password"
        placeholder="Senha"
     required autocomplete="new-password">

    <button type="submit">
        Cadastrar
    </button>

<p>Já tem conta? <a href="login.html">Entrar</a></p>
</form>

<script>

async function registrar(){
    const API = window.location.origin;
    const nome =
        document.getElementById("nome").value;

    const posto =
        document.getElementById("posto").value;

    const telefone =
        document.getElementById("telefone").value;

    const senha =
        document.getElementById("senha").value;

    const res = await fetch(`${API}/register`,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body: JSON.stringify({
            nome,
            posto,
            telefone,
            senha
        })
    });

    if(!res.ok){

        alert("Erro ao cadastrar");

        return;
    }

    alert("Conta criada");

    window.location.href = "login.html";
}

</script>

</body>
</html>
